# Generated by chain dev/build from chain-sdk's templates and package.json
# — edits here are overwritten. Native settings go in package.json "chain".
[package]
name = "{{crate}}"
version = "0.1.0"
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name apart from the bin name (cargo#8519).
name = "{{lib}}"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# "protocol-asset": desktop.files.url()'s asset: scheme. "unstable":
# Window::add_child, for desktop.browser's toolbar webview.
tauri = { version = "2", features = ["protocol-asset", "unstable"] }
tauri-plugin-opener = "2"
# desktop.updates. ~2.12: newer versions need a newer tauri than apps lock.
tauri-plugin-updater = "~2.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
{{chainCore}}

[features]
# Only `chain dev` passes --features chain-dev-inspector; `chain build`
# never does, so a release binary contains none of dev_inspector.rs.
chain-dev-inspector = []

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Full debug info for Tauri's ~400 dependencies roughly doubles target/.
# Your own code keeps file:line in backtraces.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
